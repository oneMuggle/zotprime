name: Test Win7 Build

on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'prebuild_client_win7.Dockerfile'
      - 'clientbuildtest_win7.Dockerfile'
      - 'bin/detect-win-version.sh'
      - 'bin/build-local.sh'
      - 'bin/package-for-intranet.sh'
      - 'bin/deploy-intranet.sh'
      - 'bin/set-zotero-dataserver.ps1'
      - 'tests/**'
      - 'docs/superpowers/specs/2026-06-07-win7-compatibility-design.md'
      - 'docs/plans/2026-06-07-win7-compatibility.md'
      - '.gitmodules'
      - 'client/zotero-standalone-build-win7/**'
      - 'client/zotero-client-win7/**'
      - '.github/workflows/test-win7-build.yml'
  push:
    branches: [ "main", "develop", "feature/win7-compatibility" ]
  workflow_dispatch:

jobs:
  bats-and-shellcheck:
    name: Bats + shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Rewrite git:// -> https:// for nested submodules
        # 5.0.96.3 era nested submodules (zotero-schema, bundled-styles,
        # translators, csl-locales, zotero-word-*-integration, etc.) reference
        # `git://github.com/...` URLs, but the GitHub Actions runner cannot
        # connect to port 9418 (git:// has been deprecated by GitHub).
        # git's insteadOf rewrites the URL on every fetch/clone — transparent
        # to .gitmodules and does not modify the submodule refs.
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global url."https://".insteadOf "git://"
          # If a previous step in the workflow already tried to clone and
          # left .git/modules dirs in a partial state, clean them so the
          # rewrite takes effect.
          for path in client/zotero-client-win7 client/zotero-standalone-build-win7; do
            if [ -d "$path/.git" ]; then
              echo "[INFO] Cleaning $path for re-init under URL rewrite"
              rm -rf "$path"
            fi
          done
          # Re-init from the main repo's .gitmodules
          git submodule update --init --recursive

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bats \
            shellcheck \
            jq \
            p7zip-full

      - name: Verify shell scripts syntax
        run: |
          set -e
          for f in bin/detect-win-version.sh \
                   bin/build-local.sh \
                   bin/package-for-intranet.sh \
                   bin/deploy-intranet.sh \
                   bin/set-zotero-dataserver.ps1; do
            case "$f" in
              *.ps1) echo "[OK] skipping bash -n for PowerShell: $f" ;;
              *)     bash -n "$f" && echo "[OK] bash -n: $f" ;;
            esac
          done

      - name: Verify JSON schema
        run: |
          jq empty tests/integration/manifest-schema.json && echo "[OK] manifest-schema.json valid JSON"

      - name: Run bats unit tests (skip integration)
        run: |
          set -e
          # Run only unit-test files (not the integration ones that need a built image)
          bats tests/bin/ tests/submodule/

      - name: shellcheck
        run: |
          set +e
          for f in bin/detect-win-version.sh \
                   bin/build-local.sh \
                   bin/package-for-intranet.sh \
                   bin/deploy-intranet.sh; do
            shellcheck "$f" || echo "[WARN] shellcheck issues in $f (continuing)"
          done
        continue-on-error: false

  build-and-verify:
    name: Build Win7 client (A' injection) and verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Rewrite git:// -> https:// for nested submodules
        # 5.0.96.3 era nested submodules reference `git://github.com/...`
        # URLs which the Actions runner cannot reach. Use git's insteadOf
        # URL rewrite to transparently redirect all git operations to https.
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global url."https://".insteadOf "git://"
          for path in client/zotero-client-win7 client/zotero-standalone-build-win7; do
            if [ -d "$path/.git" ]; then
              echo "[INFO] Cleaning $path for re-init under URL rewrite"
              rm -rf "$path"
            fi
          done
          git submodule update --init --recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Win7 client (A' injection pipeline)
        env:
          WIN7_VERSION: 5.0.96.3
          HOST_DS: "http://zotprime.local:8080/"
          HOST_ST: "ws://zotprime.local:8081/"
        run: |
          set -eu
          mkdir -p dist
          docker buildx build \
            --load \
            --build-arg WIN7_VERSION \
            --build-arg HOST_DS \
            --build-arg HOST_ST \
            -f prebuild_client_win7.Dockerfile \
            -t zotprime-client:win7-5.0.96.3 \
            .
          # Export artifacts out of the image
          CID=$(docker create zotprime-client:win7-5.0.96.3)
          docker cp "$CID":/dist/ ./dist/
          docker rm "$CID"
          ls -la dist/

      - name: Verify artifacts exist
        run: |
          set -eu
          test -f dist/Zotero-5.0.96.3_win-x86_64-setup.exe || { echo "[FATAL] setup.exe not built" >&2; exit 1; }
          test -f dist/Zotero-5.0.96.3_win-x86_64-setup.exe.sha256 || { echo "[FATAL] sha256 sidecar not built" >&2; exit 1; }
          test -s dist/Zotero-5.0.96.3_win-x86_64-setup.exe || { echo "[FATAL] setup.exe is empty" >&2; exit 1; }
          echo "[OK] Win7 artifacts present and non-empty"

      - name: Verify sha256 round-trips
        run: |
          set -eu
          cd dist
          sha256sum -c Zotero-5.0.96.3_win-x86_64-setup.exe.sha256

      - name: Install 7z for A' injection verification
        run: sudo apt-get install -y --no-install-recommends p7zip-full

      - name: Verify A' injection (XPI contains injected dataserver URL)
        run: |
          set -eu
          TMP=$(mktemp -d)
          7z x -y -o"$TMP" dist/Zotero-5.0.96.3_win-x86_64-setup.exe >/dev/null
          XPI=$(find "$TMP" -name 'zotero@chnm.org.xpi' | head -1)
          if [ -z "$XPI" ]; then
            echo "[FATAL] zotero@chnm.org.xpi not found in installer" >&2
            find "$TMP" -name '*.xpi' | head -5 >&2
            exit 1
          fi
          echo "[OK] Found XPI: $XPI"
          XPI_TMP=$(mktemp -d)
          7z x -y -o"$XPI_TMP" "$XPI" >/dev/null
          CONFIG="$XPI_TMP/resource/config.js"
          if [ ! -f "$CONFIG" ]; then
            echo "[FATAL] resource/config.js not in XPI" >&2
            find "$XPI_TMP" -name '*.js' | head -10 >&2
            exit 1
          fi
          echo "--- config.js (first 20 lines) ---"
          head -20 "$CONFIG"
          echo "--- injection check ---"
          if grep -q "zotprime.local" "$CONFIG"; then
            echo "[OK] A' injection: zotprime.local found in config.js"
          else
            echo "[FATAL] A' injection FAILED: 'zotprime.local' not in config.js" >&2
            exit 1
          fi
          if grep -q "https://api.zotero.org" "$CONFIG"; then
            echo "[FATAL] Original API URL not replaced: https://api.zotero.org still present" >&2
            exit 1
          fi
          echo "[OK] Original https://api.zotero.org is gone (A' replaced it)"
          rm -rf "$TMP" "$XPI_TMP"

      - name: Upload Win7 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zotprime-win7-client
          path: |
            dist/Zotero-5.0.96.3_win-x86_64-setup.exe
            dist/Zotero-5.0.96.3_win-x86_64-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7
